# Runs one heavy job (video render / audio transcription) for the web service. Triggered by the service via workflow_dispatch.
name: render-job
run-name: job ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id created by the web service
        required: true
        type: string

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run job
        run: node src/remoteRunner.js "${{ inputs.job_id }}"
        env:
          NODE_ENV: production
          DB_DRIVER: firestore
          STORAGE_DRIVER: r2
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TRANSCRIBE_MODEL: ${{ vars.GEMINI_TRANSCRIBE_MODEL || 'gemini-3.5-transcribe' }}
          # a runner has real CPUs: use them (output size/fps/resolution come from the web service's settings)
          FFMPEG_LOW_PRIORITY: '0'
          RENDER_THREADS: '2'
          RENDER_PRESET: veryfast
